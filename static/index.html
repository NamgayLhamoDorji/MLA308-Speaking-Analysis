<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Speaking Platform — Skeleton (replace with Member D's real dashboard)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; }
  #result { white-space: pre-wrap; background: #f4f4f4; padding: 12px; border-radius: 6px; margin-top: 16px; }
  button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <h1>Speaking Platform — pipeline skeleton</h1>
  <p>This is a placeholder page just to prove the pipeline works end-to-end. Member D replaces this whole file with the real dashboard — the <code>POST /api/analyze</code> contract below stays the same either way.</p>

  <input type="file" id="videoInput" accept="video/*">
  <button onclick="analyze()">Analyze</button>
  <div id="result"></div>

  <script>
    async function analyze() {
      const input = document.getElementById('videoInput');
      const resultEl = document.getElementById('result');
      if (!input.files.length) { alert('Choose a video first'); return; }

      resultEl.textContent = 'Processing...';
      const formData = new FormData();
      formData.append('file', input.files[0]);

      try {
        const res = await fetch('/api/analyze', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Analysis failed');
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
